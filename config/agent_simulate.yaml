# Base
seed: 9999

# LLM model
supervisor_model: gpt-5-nano
task_model: gpt-5-nano
vllm_url: http://0.0.0.0:8000     # Used only when using vllm.

# Simulation environment
agent_test_data: hospital_data/primary/agent_data
fhir_url: http://localhost:8080/fhir
integration_with_fhir: False

# Hospital environment
booking_days_before_simulation: 3       # Number of days before the simulation date when appointment booking can start
fhir_max_connection_retries: 5          # Maximum number of retry attempts when retrieving data from the FHIR server
schedule_cancellation_prob: 0.05
request_early_schedule_prob: 0.1

# Simulation conditions
outpatient_intake:
    use_supervisor: False
    intake_max_inference: 5
schedule_task:
    scheduling_strategy: tool_calling   # ['llm', 'tool_calling']
    opfv_schedule_cancellation_prob: 0.1    # First-visit scheduling cancellation prob.
    opfv_request_early_schedule_prob: 0.15  # First-visit scheduling rescheduling prob.
    opfu_schedule_cancellation_prob: 0.05   # Follow-up-visit scheduling cancellation prob.
    opfu_request_early_schedule_prob: 0.075  # Follow-up-visit scheduling rescheduling prob.
    negotiation:
        policy: policy1
        policy1:
            type: result_gain       # Trigger index ti = GPC * TCL / τ, gain = result-time gain R
            mode: threshold     # [threshold, hospital-side, patient-side]
            tcl_temperature: 1.0
            trigger_temperature_visit: 1.0
            trigger_temperature_stay: 1.0
            negotiation_trigger_threshold: 1.0
            capacity_protection:            # Airline-style booking limit: hold back a share of each test's capacity for urgent patients
                enabled: False
                ratio: 0.2                  # Share of each (test, date) start-of-simulation free capacity reserved for urgent patients, in [0, 1)
                horizon_days: 3             # Protect only dates opening within this many days of the current time
                release_hours: 24           # Release a protected date to normal patients once it opens within this many hours